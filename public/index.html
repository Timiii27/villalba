<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scouting Liga VIPS · Villalba Gilmar</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface-2:#F6F8F6; --ink:#14201A; --muted:#5D6B63; --line:#D7DED9;
  --pine:#0F3D2E; --pine-2:#1E6248; --gold:#E2B31D; --gold-ink:#5A4300; --bad:#B42318; --good:#16794A;
  --head-ink:#FFFFFF; --chip:#E3EAE5;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1411; --surface:#141E19; --surface-2:#18241E; --ink:#E6EEE9; --muted:#9AAAA1; --line:#25332C;
    --pine:#123F30; --pine-2:#3E9C76; --gold:#F0C83A; --gold-ink:#F0C83A; --bad:#F2796B; --good:#4CC28A;
    --head-ink:#FFFFFF; --chip:#1F2C26; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#141E19; --surface-2:#18241E; --ink:#E6EEE9; --muted:#9AAAA1; --line:#25332C;
  --pine:#123F30; --pine-2:#3E9C76; --gold:#F0C83A; --gold-ink:#F0C83A; --bad:#F2796B; --good:#4CC28A;
  --head-ink:#FFFFFF; --chip:#1F2C26; color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Barlow, "Helvetica Neue", Arial, sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.num,.cond{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
h1,h2,h3{margin:0;line-height:1.1}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tab-num{font-variant-numeric:tabular-nums}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--pine)}
.login-card{width:min(380px,100%);background:var(--surface);border-radius:14px;padding:28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login-card h1{font-size:34px;color:var(--ink)}
.login-card p{color:var(--muted);margin:6px 0 20px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:14px}
.field input{padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--pine);color:#fff}
.btn.gold{background:var(--gold);color:#1b1500}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.login-card .btn{width:100%;padding:12px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.stripe{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--pine) 0 60%,var(--gold) 60% 100%);margin-bottom:18px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pine);color:var(--head-ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--pine)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-family:"Barlow Condensed",sans-serif;font-size:24px;letter-spacing:.2px}
.brand span{color:#BFD3C8;font-size:13px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav.tabs button{background:transparent;border:0;color:#CFE0D7;padding:8px 12px;border-radius:7px;cursor:pointer;font-weight:600;white-space:nowrap}
nav.tabs button[aria-current="true"]{background:var(--gold);color:#1b1500}
.top-actions{display:flex;gap:8px}
@media (max-width:760px){.top-in{gap:8px 12px;padding:8px 14px}.brand span{display:none}.top-actions{margin-left:auto}nav.tabs{order:3;flex-basis:100%}}
.seg{max-width:100%;overflow-x:auto}.seg button{white-space:nowrap}
.top-actions button{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:7px;padding:7px 10px;cursor:pointer;font-size:13px}

main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
.view{display:none}.view.on{display:block}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.view-head h2{font-size:30px}
.sub{color:var(--muted);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.panel h3{font-size:21px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:880px){.grid2{grid-template-columns:1fr}}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:12.5px;position:sticky;top:0;background:var(--surface);cursor:default}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th.active{color:var(--ink)}
th.active::after{content:" ▾";font-size:10px}
th.active.asc::after{content:" ▴"}
td.l,th.l{text-align:left}
tbody tr{background:var(--surface)}
tbody tr:hover{background:var(--surface-2)}
tr.me{background:color-mix(in srgb,var(--gold) 16%,var(--surface))}
tr.me:hover{background:color-mix(in srgb,var(--gold) 24%,var(--surface))}
td.stick,th.stick{position:sticky;left:0;z-index:1}
td.stick{background:inherit}
.nm-short,.nm-mini{display:none}.nm-sub{font-size:12px}
@media (max-width:720px){.hide-s{display:none}.nm-full,.nm-sub{display:none}.nm-short{display:inline}.nm-mini{display:block;font-size:11.5px}
  td.stick,th.stick{box-shadow:1px 0 0 var(--line);max-width:46vw;overflow:hidden;text-overflow:ellipsis}}
tr.click{cursor:pointer}
td.team{font-weight:600}
.dorsal{display:inline-block;min-width:26px;padding:1px 5px;border-radius:5px;background:var(--chip);font-family:"Barlow Condensed",sans-serif;font-weight:700;text-align:center;margin-right:6px}
.wl{display:inline-flex;gap:3px}
.wl i{width:16px;height:16px;border-radius:4px;display:inline-grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:#fff}
.wl .w{background:var(--good)}.wl .d{background:var(--bad)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.rk{font-size:11px;color:var(--muted);margin-left:4px}
.rk.top{color:var(--good)}.rk.low{color:var(--bad)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.filters label{display:grid;gap:3px;font-size:12.5px;color:var(--muted);font-weight:600}
.filters select,.filters input{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);min-width:120px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 11px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--pine);color:#fff}

/* scoreboard */
.board{background:var(--pine);color:#fff;border-radius:14px;padding:20px 22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-bottom:16px;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:22px solid rgba(226,179,29,.18)}
.board h2{font-size:46px;letter-spacing:.3px}
.board .meta{color:#BFD3C8;margin-top:4px}
.board .rec{font-family:"Barlow Condensed",sans-serif;font-size:64px;font-weight:700;line-height:1;color:var(--gold);text-align:right;position:relative;z-index:1}
.board .rec small{display:block;font-size:15px;color:#BFD3C8;font-family:Barlow,sans-serif;font-weight:500}
.board-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;position:relative;z-index:1}
@media (max-width:640px){.board{grid-template-columns:1fr}.board .rec{text-align:left}.board h2{font-size:36px}}
.team-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.team-pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13.5px}
.team-pick button[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.team-pick button.me-t{border-color:var(--gold)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .v{font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:700;line-height:1.05}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .s{font-size:12.5px;color:var(--muted)}

.keys{margin:0;padding-left:0;list-style:none;display:grid;gap:9px}
.keys li{padding-left:16px;position:relative;line-height:1.45}
.keys li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:2px;background:var(--gold)}
.keys.warn li::before{background:var(--pine-2)}

.bar{height:8px;border-radius:4px;background:var(--chip);position:relative;overflow:hidden;min-width:80px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--pine-2);border-radius:4px}
.bar.opp i{background:var(--gold)}
.ff td{vertical-align:middle}

.danger{display:inline-flex;gap:2px;vertical-align:middle}
.danger i{width:9px;height:12px;border-radius:2px;background:var(--chip)}
.danger i.on{background:var(--bad)}

/* modal */
dialog{border:0;border-radius:14px;padding:0;max-width:min(980px,96vw);width:100%;background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,15,10,.55)}
.dlg-head{background:var(--pine);color:#fff;padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dlg-head h2{font-size:32px}
.dlg-head .meta{color:#BFD3C8}
.dlg-body{padding:16px 20px 20px;max-height:76vh;overflow:auto}
.close{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}

.chart svg{width:100%;height:auto;display:block}
.cal-j{margin-bottom:14px}
.cal-j h3{font-size:19px;margin-bottom:6px}
.cal-row{display:grid;grid-template-columns:90px 1fr 70px 1fr;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);align-items:center}
.cal-row .h{text-align:right}.cal-row .sc{text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px}
.cal-row.mine{background:color-mix(in srgb,var(--gold) 16%,transparent);border-radius:6px}
.cal-row .f{color:var(--muted);font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
details.legend{margin-top:10px;font-size:13.5px}
details.legend summary{cursor:pointer;font-weight:600;color:var(--pine-2)}
details.legend dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:10px 0 0}
details.legend dt{font-weight:700}
details.legend dd{margin:0;color:var(--muted)}
.drill{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface-2)}
.drill h4{margin:0 0 3px;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:20px;line-height:1.15}
.drill .why{color:var(--muted);font-size:13.5px;margin-bottom:8px}
.drill dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0;font-size:14px}
.drill dt{font-weight:700}.drill dd{margin:0}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.day{border:1px solid var(--line);border-radius:10px;padding:12px 14px;border-top:4px solid var(--pine-2)}
.day-h{margin-bottom:6px}.day ol{margin:0;padding-left:0;list-style:none;display:grid;gap:7px;font-size:14px}
.team-sel{display:none;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600;margin-bottom:12px}
@media (max-width:720px){.team-pick{display:none}.team-sel{display:block}}
.subtabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.subtabs button{border:0;background:transparent;padding:9px 14px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.bar-row{display:flex;justify-content:space-between;align-items:flex-end;gap:6px 16px;flex-wrap:wrap}
.bar-row>#teamTabs{flex:1;min-width:0}
details.more{margin-top:10px}
details.more summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--pine-2);margin-bottom:9px}
.board .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.board.next h2{font-size:38px}.board.next .rec{font-size:54px}.board.next .rec small{font-size:13.5px;line-height:1.35;margin-top:4px}
@media (max-width:640px){.board.next h2{font-size:30px}.board.next .rec{font-size:44px}}
.fc{display:flex;justify-content:space-between;align-items:center;gap:14px 24px;flex-wrap:wrap}
.fc-main{flex:1;min-width:260px}
.fc-score{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:30px;font-weight:600;line-height:1.15;margin:2px 0 8px}
.fc-score b{font-weight:700;color:var(--pine-2)}
.fc-bar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}.fc-bar i{display:block;height:100%;background:var(--gold);border-radius:5px 0 0 5px}
.fc-p{text-align:right;color:var(--muted);font-size:13px;line-height:1.3}
.fc-p b{display:block;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:46px;line-height:1;color:var(--ink)}
.pct{display:grid;gap:9px}
.pct-r{display:grid;grid-template-columns:minmax(110px,34%) 1fr 62px;gap:10px;align-items:center;font-size:14px}
.pct .bar{height:10px;border-radius:5px;min-width:0}.pct .bar.hi i{background:var(--gold)}
.pct-v{text-align:right;font-weight:600}
.day .mins{display:inline-block;min-width:34px;font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--pine-2)}
.cmp td.mid{text-align:center;color:var(--muted);font-weight:600}
.cmp .better{font-weight:700;color:var(--good)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;display:none;z-index:50}
@media (prefers-reduced-motion:no-preference){.board{animation:rise .35s ease-out}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<section id="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="stripe"></div>
    <h1>Scouting Liga VIPS</h1>
    <p>Acceso solo para el cuerpo técnico de Villalba Gilmar.</p>
    <div class="field"><label for="u">Usuario</label><input id="u" name="username" autocomplete="username" required></div>
    <div class="field"><label for="p">Contraseña</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">Entrar</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</section>

<div id="app" hidden>
<header class="top"><div class="top-in">
  <div class="brand"><b>Villalba Gilmar</b><span>Scouting Liga VIPS</span></div>
  <nav class="tabs" id="tabs" aria-label="Secciones">
    <button data-v="clasif">Clasificación</button>
    <button data-v="equipo">Equipos</button>
    <button data-v="jugadores">Jugadores</button>
    <button data-v="vs">Villalba vs rival</button>
    <button data-v="plan">Preparar la semana</button>
    <button data-v="cal">Calendario</button>
  </nav>
  <div class="top-actions"><button id="themeBtn" type="button">Tema</button><button id="logout" type="button">Salir</button></div>
</div></header>
<main>
  <section class="view" id="v-clasif"></section>
  <section class="view" id="v-equipo"></section>
  <section class="view" id="v-jugadores"></section>
  <section class="view" id="v-vs"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-cal"></section>
</main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
let D=null;
/* ---------------- login ---------------- */
const $login=document.getElementById('login'), $app=document.getElementById('app'), $err=document.getElementById('loginErr');
async function loadData(){
  const r=await fetch('/api/data',{credentials:'same-origin',cache:'no-store'});
  if(r.status===401) return null;
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function showLogin(){ $app.hidden=true; $login.hidden=false; }
function showApp(){ $login.hidden=true; $app.hidden=false; start(); }
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); $err.textContent='';
  const btn=e.target.querySelector('button'); btn.disabled=true; btn.textContent='Entrando…';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',
      body:JSON.stringify({user:document.getElementById('u').value,pass:document.getElementById('p').value})});
    if(!r.ok){ $err.textContent=r.status===401?'Usuario o contraseña incorrectos.':'No se ha podido iniciar sesión. Inténtalo otra vez.'; return; }
    D=await loadData(); if(D) showApp(); else $err.textContent='La sesión no se ha guardado. Revisa que el navegador acepte cookies.';
  }catch(err){ $err.textContent='No hay conexión con el servidor. Inténtalo otra vez.'; }
  finally{ btn.disabled=false; btn.textContent='Entrar'; }
});
document.getElementById('logout').addEventListener('click',async()=>{try{await fetch('/api/logout',{method:'POST',credentials:'same-origin'});}catch(e){} location.reload();});
document.getElementById('themeBtn').addEventListener('click',()=>{
  const r=document.documentElement; const dark=matchMedia('(prefers-color-scheme: dark)').matches;
  const cur=r.dataset.theme || (dark?'dark':'light'); r.dataset.theme = cur==='dark'?'light':'dark'; try{localStorage.setItem('vgl_theme',r.dataset.theme)}catch(e){}
});
try{const t=localStorage.getItem('vgl_theme'); if(t) document.documentElement.dataset.theme=t;}catch(e){}

function start(){
/* ---------------- model ---------------- */
const C=D.cols, ci={}; C.forEach((c,i)=>ci[c]=i);
const NT=D.teams.length, ME=D.me;
const TS=i=>D.teams[i][0], TF=i=>D.teams[i][1];
const AB=i=>{const n=TS(i);return n.startsWith('San ')?n:n.split(' ')[0]};
const games=D.games.map((g,i)=>({i,j:g[0],fecha:g[1],d:toDate(g[1]),h:g[2],a:g[3],hp:g[4],ap:g[5]}));
function toDate(s){const [d,m,y]=s.split('/').map(Number);return new Date(y,m-1,d)}
const TG={}; // key gi_t -> stats object
D.tg.forEach(r=>{const o={};C.forEach((c,k)=>o[c]=r[2+k]);TG[r[0]+'_'+r[1]]=o;});
const players=D.players.map((p,i)=>({i,name:p[0],t:p[1],rows:[]}));
D.pg.forEach(r=>{const o={g:r[0],num:r[2]};C.forEach((c,k)=>o[c]=r[3+k]);o.pm=r[3+C.length];players[r[1]].rows.push(o);});
players.forEach(p=>{p.rows.sort((a,b)=>games[a.g].d-games[b.g].d||a.g-b.g);
  const cnt={};p.rows.forEach(r=>cnt[r.num]=(cnt[r.num]||0)+1);p.num=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0];
  const [sur,first]=p.name.split(', ');p.sur=(sur||p.name).trim();p.first=first||'';const sw=p.sur.split(' ');
  p.short=(['de','del','la','las','los','da','di','van','von','el','san'].includes(sw[0].toLowerCase())&&sw[1])?sw[0][0].toUpperCase()+sw[0].slice(1)+' '+sw[1]:sw[0];});
// disambiguate short names within team

    const txt={p3:(a,b)=>`meten el ${pc(a)} de triples (resto ${pc(b)})`,t3m:(a,b)=>`meten ${f1(a)} triples (resto ${f1(b)})`,p2:(a,b)=>`aciertan el ${pc(a)} de 2 (resto ${pc(b)})`,
      tla:(a,b)=>`tiran ${f1(a)} libres (resto ${f1(b)})`,ro:(a,b)=>`cogen ${f1(a)} rebotes ofensivos (resto ${f1(b)})`,as:(a,b)=>`dan ${f1(a)} asistencias (resto ${f1(b)})`,
      per:(a,b)=>`pierden solo ${f1(a)} balones (resto ${f1(b)})`,poss:(a,b)=>`juegan más rápido: ${f1(a)} posesiones (resto ${f1(b)})`};
    const parts=M.slice(1).filter(([l,k,fm,th])=>th>0?avg(hi,k)-avg(lo,k)>=th:avg(hi,k)-avg(lo,k)<=th).map(([l,k])=>txt[k](avg(hi,k),avg(lo,k)));
    if(k3(parts)) out.ins.push(`<b>Cuando más anotan</b> (sus ${h} mejores partidos, ${f1(avg(hi,'my'))} puntos frente a ${f1(avg(lo,'my'))}): ${namesList(parts.slice(0,4))}.`);
    tps.map(a=>({a,x:ptsIn(a,hi),y:ptsIn(a,lo)})).filter(o=>o.x&&o.y&&o.x.n>=2&&o.y.n>=2&&o.x.v-o.y.v>=5).sort((p,q)=>(q.x.v-q.y.v)-(p.x.v-p.y.v)).slice(0,2)
      .forEach(o=>out.ins.push(`<b>${NM(o.a)}</b> se dispara en esos partidos: ${f1(o.x.v)} puntos frente a ${f1(o.y.v)} en el resto. Si se le para a él, bajan.`));
    // los partidos en que más les anotan
    const OM=[['Puntos recibidos','op',f1,0],['% de triples del rival','o3',pc,0.06],['Triples del rival','ot3m',f1,2],['% de 2 del rival','o2',pc,0.06],['Libres del rival','otla',f1,5],['Reb. ofensivos del rival','oro',f1,3],['Sus pérdidas','per',f1,3],['Posesiones','poss',f1,5]];
    out.otbl=OM.map(([l,k,fm])=>[l,fm(avg(ohi,k)),fm(avg(olo,k))]); out.otbl.push(['Balance',rec(ohi),rec(olo)]);
    const otxt={o3:(a,b)=>`el rival mete el ${pc(a)} de triples (resto ${pc(b)})`,ot3m:(a,b)=>`les meten ${f1(a)} triples (resto ${f1(b)})`,o2:(a,b)=>`el rival mete el ${pc(a)} de 2 (resto ${pc(b)})`,
      otla:(a,b)=>`el rival tira ${f1(a)} libres (resto ${f1(b)})`,oro:(a,b)=>`les cogen ${f1(a)} rebotes ofensivos (resto ${f1(b)})`,per:(a,b)=>`pierden ${f1(a)} balones (resto ${f1(b)})`,
      poss:(a,b)=>`el partido va más rápido: ${f1(a)} posesiones (resto ${f1(b)})`};
    const oparts=OM.slice(1).filter(([l,k,fm,th])=>avg(ohi,k)-avg(olo,k)>=th).map(([l,k])=>otxt[k](avg(ohi,k),avg(olo,k)));
    if(oparts.length) out.oins.push(`<b>Cuando más les anotan</b> (sus ${h} peores partidos en defensa, ${f1(avg(ohi,'op'))} puntos recibidos frente a ${f1(avg(olo,'op'))}): ${namesList(oparts.slice(0,4))}.`);
    const ph=posSplit(t,ohi.map(x=>x.g)), pl=posSplit(t,olo.map(x=>x.g));
    GRPS.forEach(k=>{if(ph.opp[k]-pl.opp[k]>=6) out.oins.push(`En esos partidos los <b>${GL[k]} rivales</b> les hicieron ${f1(ph.opp[k])} puntos (resto ${f1(pl.opp[k])}).`);});
  }
  // victorias y derrotas
  const W=rows.filter(x=>x.w), Lo=rows.filter(x=>!x.w);
  if(W.length>=2&&Lo.length>=2) tps.map(a=>({a,x:ptsIn(a,W),y:ptsIn(a,Lo)})).filter(o=>o.x&&o.y&&o.x.n>=2&&o.y.n>=2&&Math.abs(o.x.v-o.y.v)>=5).sort((p,q)=>Math.abs(q.x.v-q.y.v)-Math.abs(p.x.v-p.y.v)).slice(0,2)
    .forEach(o=>out.wl.push(o.x.v>o.y.v?`En sus victorias <b>${NM(o.a)}</b> hace ${f1(o.x.v)} puntos; en las derrotas, ${f1(o.y.v)}.`:`Curioso: <b>${NM(o.a)}</b> anota más cuando pierden (${f1(o.y.v)}) que cuando ganan (${f1(o.x.v)}).`));
  const st=standings(), half=new Set(st.slice(0,Math.ceil(NT/2)).map(r=>r.t));
  const vt=rows.filter(x=>half.has(oppOf(x.g,t))), vb=rows.filter(x=>!half.has(oppOf(x.g,t)));
  const rec2=arr=>`${arr.filter(x=>x.w).length}-${arr.filter(x=>!x.w).length}`;
  if(vt.length&&vb.length) out.wl.push(`Contra equipos de la mitad alta: ${rec2(vt)} (${f1(avg(vt,'my'))} a ${f1(avg(vt,'op'))} de media). Contra la mitad baja: ${rec2(vb)} (${f1(avg(vb,'my'))} a ${f1(avg(vb,'op'))}).`);
  const hm=rows.filter(x=>x.home), aw=rows.filter(x=>!x.home);
  if(hm.length&&aw.length) out.wl.push(`En casa ${rec2(hm)} (${f1(avg(hm,'my'))} a ${f1(avg(hm,'op'))}); fuera ${rec2(aw)} (${f1(avg(aw,'my'))} a ${f1(avg(aw,'op'))}).`);
  return out;
  function k3(p){return p.length>0}
}

function sortableTable(cols,rows,opts={}){
  // cols: [{k,label,l,fmt,cls,title,sortVal}] rows: objects
  const id='t'+Math.random().toString(36).slice(2);
  const st={k:opts.sortKey||null,asc:!!opts.asc};
  const wrap=document.createElement('div');wrap.className='tbl-wrap';
  function draw(){
    let rs=rows.slice(); if(st.k){const c=cols.find(c=>c.k===st.k);const sv=c.sortVal||(r=>r[c.k]);rs.sort((a,b)=>{const x=sv(a),y=sv(b);return (typeof x==='string'?x.localeCompare(y):x-y)*(st.asc?1:-1);});}
    wrap.innerHTML='<table><thead><tr>'+cols.map(c=>`<th class="${c.l?'l ':''}${c.stick?'stick ':''}${c.hideS?'hide-s ':''}${c.nosort?'':'sort '}${st.k===c.k?'active '+(st.asc?'asc':''):''}" data-k="${c.k}" ${c.title?`title="${esc(c.title)}"`:''} scope="col">${c.label}</th>`).join('')+'</tr></thead><tbody>'+
      rs.map(r=>`<tr class="${opts.rowCls?opts.rowCls(r):''}" ${opts.onRow?'data-i="'+opts.rowId(r)+'" tabindex="0"':''}>`+cols.map(c=>`<td class="${c.l?'l ':''}${c.stick?'stick ':''}${c.hideS?'hide-s ':''}${c.cls?c.cls(r):''}">${c.fmt?c.fmt(r):r[c.k]}</td>`).join('')+'</tr>').join('')+'</tbody></table>';
    wrap.querySelectorAll('th.sort').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.k;if(st.k===k)st.asc=!st.asc;else{st.k=k;st.asc=false;}draw();}));
    if(opts.onRow) wrap.querySelectorAll('tbody tr').forEach(tr=>{tr.classList.add('click');const go=()=>opts.onRow(tr.dataset.i);tr.addEventListener('click',go);tr.addEventListener('keydown',e=>{if(e.key==='Enter')go();});});
  }
  draw(); return wrap;
}

/* ---------------- views ---------------- */
function keysList(arr,max,cls,empty){
  const li=a=>a.map(x=>`<li>${x}</li>`).join('');
  if(!arr.length) return `<ul class="keys ${cls||''}"><li>${empty||'Sin datos.'}</li></ul>`;
  if(arr.length<=max+2) max=arr.length;
  return `<ul class="keys ${cls||''}">${li(arr.slice(0,max))}</ul>`+(arr.length>max?`<details class="more"><summary>Ver ${arr.length-max} más</summary><ul class="keys ${cls||''}">${li(arr.slice(max))}</ul></details>`:'');
}

let vsRival=null;
function matchup(r){
  const V=TA[ME], R=TA[r]; const adv=[],risk=[];
  const cmp=(cond,txt,arr)=>{if(cond)arr.push(txt)};
  cmp(V.efg-R.oefg>0.02,`Nuestro tiro (${pc(V.efg)} efectivo) está por encima de lo que suelen permitir (${pc(R.oefg)}).`,adv);
  cmp(R.efg-V.oefg>0.02,`Su tiro (${pc(R.efg)} efectivo) supera lo que solemos permitir nosotros (${pc(V.oefg)}).`,risk);
  cmp(R.tov-LG.tov>0.01&&V.otov>=LG.otov-0.01,`Ellos pierden el ${pc(R.tov)} de sus posesiones: presionar puede darnos canastas fáciles.`,adv);
  cmp(V.tov-LG.tov>0.01&&R.otov>LG.otov,`Nosotros perdemos el ${pc(V.tov)} y ellos fuerzan pérdidas (${pc(R.otov)}): cuidar el balón.`,risk);
  cmp(V.orb-(1-R.drb)>0.02,`Rebote ofensivo: cogemos el ${pc(V.orb)} y ellos conceden el ${pc(1-R.drb)}. Ir al rechace.`,adv);
  cmp(R.orb-(1-V.drb)>0.02,`Su rebote ofensivo (${pc(R.orb)}) contra nuestro rebote defensivo (${pc(V.drb)}): cerrar.`,risk);
  cmp(R.p3<LG.p3-0.02,`Tiran mal de 3 (${pc(R.p3)}): se puede flotar y cerrar la zona.`,adv);
  cmp(R.p3>LG.p3+0.02,`Tiran bien de 3 (${pc(R.p3)}): salir a sus tiradores.`,risk);
  cmp(R.ft<LG.ft-0.04,`Fallan libres (${pc(R.ft)}): mejor falta que canasta fácil.`,adv);
  cmp(V.ftr>R.oftr+0.03,`Vamos más a la línea (${pc(V.ftr)}) de lo que ellos suelen conceder (${pc(R.oftr)}).`,adv);
  cmp(R.ftr>V.oftr+0.03,`Ellos van mucho a la línea (${pc(R.ftr)}): defender sin manos.`,risk);
  cmp(Math.abs(V.pace-R.pace)>=3,R.pace>V.pace?`Juegan más rápido que nosotros (${f1(R.pace)} frente a ${f1(V.pace)} posesiones): controlar el ritmo.`:`Juegan más lento (${f1(R.pace)} frente a ${f1(V.pace)} posesiones): correr puede sacarles del partido.`,R.pace>V.pace?risk:adv);
  const rk2=(k,t,asc)=>rank(k,t,asc);
  cmp(rk2('drtg',r,1)>=9,`Defienden mal: reciben ${f1(R.drtg)} puntos por 100 posesiones (${rk2('drtg',r,1)}º de 12).`,adv);
  cmp(rk2('ortg',r)>=9,`Les cuesta anotar: ${f1(R.ortg)} puntos por 100 posesiones (${rk2('ortg',r)}º de 12).`,adv);
  cmp(rk2('ortg',r)<=3,`Atacan muy bien: ${f1(R.ortg)} puntos por 100 posesiones (${rk2('ortg',r)}º de 12).`,risk);
  cmp(rk2('drtg',r,1)<=3,`Defienden muy bien: solo reciben ${f1(R.drtg)} por 100 posesiones (${rk2('drtg',r,1)}º de 12).`,risk);
  cmp(V.drb-(1-R.orb)>0.03&&R.orb<LG.orb,`Su rebote ofensivo es flojo (${pc(R.orb)}) y nosotros cerramos el ${pc(V.drb)} del rebote defensivo.`,adv);
  cmp(R.o3>LG.o3+0.02,`Conceden triples: el rival les mete el ${pc(R.o3)} (liga ${pc(LG.o3)}). Mover el balón hasta el tiro liberado.`,adv);
  cmp(R.o2>LG.o2+0.02,`Se les ataca bien dentro: el rival mete el ${pc(R.o2)} de 2 (liga ${pc(LG.o2)}).`,adv);
  cmp(R.fcpg>LG.fcpg+1.5,`Hacen muchas faltas (${f1(R.fcpg)} por partido): atacar el aro para meterles pronto en bonus.`,adv);
  cmp(R.o3<LG.o3-0.03,`Defienden bien el triple (el rival mete el ${pc(R.o3)}): habrá que ganar dentro.`,risk);
  cmp(R.otov>LG.otov+0.015&&V.tov>=LG.tov-0.005,`Fuerzan muchas pérdidas (${pc(R.otov)} de las posesiones del rival): pases seguros ante su presión.`,risk);
  // nombres concretos y duelos por puesto
  const rp=PA.filter(a=>a.p.t===r&&a.n>=2), vp=PA.filter(a=>a.p.t===ME&&a.n>=2);
  const sh=rp.filter(isSh).sort((x,y)=>y.S.t3m-x.S.t3m).slice(0,3);
  if(sh.length) risk.push(`Sus tiradores: ${namesList(sh.map(a=>`${NM(a)} (${pc(a.p3)}, ${f1(a.S.t3a/a.n)} triples por partido)`))}. Nunca solos.`);
  const bft=rp.filter(a=>isBadFT(a)&&a.min>=10).sort((x,y)=>x.ft-y.ft).slice(0,2);
  if(bft.length) adv.push(`Malos tiradores de libres: ${namesList(bft.map(a=>`${NM(a)} (${pc(a.ft)})`))}. En el final, falta a ellos.`);
  const PR=POS[r], PV=POS[ME];
  GRPS.forEach(k=>{
    const ours=vp.filter(a=>grp(a.p)===k&&a.ppg>=5).sort((x,y)=>y.ppg-x.ppg).slice(0,2), theirs=rp.filter(a=>grp(a.p)===k&&a.ppg>=5).sort((x,y)=>y.ppg-x.ppg).slice(0,2);
    if(PR.opp[k]-LPOS.opp[k]>=2&&ours.length) adv.push(`<b>Nuestros ${GL[k]}</b> (${namesList(ours.map(a=>`${NM(a)} ${f1(a.ppg)}`))}) contra una defensa que concede ${f1(PR.opp[k])} puntos a ese puesto (liga ${f1(LPOS.opp[k])}). Buscarles.`);
    if(PR.own[k]-LPOS.own[k]>=2&&PV.opp[k]-LPOS.opp[k]>=1&&theirs.length) risk.push(`<b>Sus ${GL[k]}</b> (${namesList(theirs.map(a=>`${NM(a)} ${f1(a.ppg)}`))}) anotan ${f1(PR.own[k])} por partido y nosotros concedemos ${f1(PV.opp[k])} a ese puesto.`);
  });

  const {adv,risk}=matchup(r);

function ptsChart(p){
  const tg=teamGames(p.t), W=640, H=170, pad=26, bw=(W-pad*2)/tg.length;
  const rows=tg.map(g=>p.rows.find(r=>r.g===g.i));
  const mx=Math.max(10,...rows.filter(Boolean).map(r=>Math.max(r.pts,r.val)))+3, mn=Math.min(0,...rows.filter(Boolean).map(r=>r.val));
  const y=v=>H-24-(v-mn)/(mx-mn)*(H-44);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Puntos y valoración por partido"><line x1="${pad}" x2="${W-pad}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  const pts=[];
  tg.forEach((g,i)=>{const r=rows[i],x=pad+i*bw+bw*0.2,w=bw*0.6,cx=pad+i*bw+bw/2;
    if(r){s+=`<rect x="${x}" y="${y(Math.max(r.pts,0))}" width="${w}" height="${Math.max(0,y(0)-y(r.pts))}" rx="3" fill="var(--pine-2)"/><text x="${cx}" y="${y(r.pts)-5}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${r.pts}</text>`;pts.push([cx,y(r.val)]);}
    else s+=`<text x="${cx}" y="${y(0)-6}" text-anchor="middle" font-size="11" fill="var(--muted)">No jugó</text>`;
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(AB(oppOf(g,p.t)))}</text>`;});
  if(pts.length>1) s+=`<polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="var(--gold)" stroke-width="2.5"/>`;
  pts.forEach(q=>s+=`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="var(--gold)"/>`);
  return s+'</svg>';
}

  y=doc.lastAutoTable.finalY+7; y=h3(y,'Cuatro factores frente a la liga');

  y=doc.lastAutoTable.finalY+6; y=h3(y,'Los que más puntos les han metido');
  y=bullets(y,PSp.tops.slice(0,6).map(x=>`${NP(x.p)} (${TS(x.p.t)}, ${x.p.pos}): ${x.r.pts} puntos, ${ma(x.r.t3m,x.r.t3a)} en triples, ${x.r.rd+x.r.ro} rebotes. Jornada ${x.g.j}, ${x.g.fecha.slice(0,5)}.`));
  const SPp=teamSplits(t,A.gl); y+=3; y=need(y,20); y=h3(y,'Cuándo anotan más y cuándo les anotan');
